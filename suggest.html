<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#FFF4DC"><meta name="apple-mobile-web-app-capable" content="yes"><title>Suggest – Clueless</title><meta name="description" content="Suggest a word or a new game for Clueless."><meta property="og:title" content="Suggest – Clueless"><meta property="og:description" content="Suggest a word or a new game for Clueless."><meta property="og:type" content="website"><meta name="twitter:card" content="summary"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2716%27 fill=%27%230D0D10%27/%3E%3Ctext x=%2732%27 y=%2744%27 font-size=%2740%27 font-weight=%27800%27 font-family=%27Arial%27 text-anchor=%27middle%27 fill=%27%23FF7A1A%27%3EC%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="shared.css"></head><body class="site" data-p="end"><div id="nav"></div><main class="wrap"><h1 class="hero">Make Clueless better</h1><p class="sub">Suggest a word, a new game, or tell us what broke.</p><form class="card" id="fm"><label for="k">What is it?</label><select id="k"><option>Word for Say Less</option><option>New game idea</option><option>Bug or feedback</option></select><label for="t">Your suggestion</label><textarea id="t" maxlength="500" required></textarea><label for="n">Your name (optional)</label><input id="n" maxlength="30"><button class="btn pink" id="b">Send</button><p class="center" id="ok"></p></form></main><footer id="ft"></footer><script src="shared.js"></script><script type="module">import {db,D} from "./fb.js";
$("fm").onsubmit=async e=>{e.preventDefault();const t=$("t").value.trim();if(!t)return;$("b").disabled=true;
try{await D.push(D.ref(db,"suggestions"),{k:$("k").value,t,n:$("n").value.trim(),ts:Date.now()});$("ok").textContent="Thanks! We got it.";$("t").value=""}catch(x){$("ok").textContent="Could not send. Try again later.";$("b").disabled=false}};</script></body></html>
