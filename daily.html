<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0D0D10"><meta name="apple-mobile-web-app-capable" content="yes"><title>Daily Clue – Clueless</title><meta name="description" content="Daily Clue: one mystery word a day, five clues, five tries."><meta property="og:title" content="Daily Clue – Clueless"><meta property="og:description" content="Daily Clue: one mystery word a day, five clues, five tries."><meta property="og:type" content="website"><meta name="twitter:card" content="summary"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2716%27 fill=%27%230D0D10%27/%3E%3Ctext x=%2732%27 y=%2744%27 font-size=%2740%27 font-weight=%27800%27 font-family=%27Arial%27 text-anchor=%27middle%27 fill=%27%23FF7A1A%27%3EC%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="shared.css"></head><body class="site" data-p="lobby"><div id="nav"></div><main class="wrap"><h1 class="hero">Daily Clue</h1><p class="sub">One word a day. Each wrong guess unlocks the next clue.</p><div class="card"><span class="pill" id="m"></span><ul class="clues" id="c" style="margin-top:12px"></ul><form class="row" id="f"><input id="gi" autocomplete="off" placeholder="Your guess…" aria-label="Your guess"><button class="btn mint">Guess</button></form><div id="gs" style="margin-top:8px"></div><div id="r" class="center"></div></div></main><footer id="ft"></footer><script src="shared.js"></script><script>const Q=["Swiggy|Orange logo;Shows up when you are hungry;Riders in orange jackets;Delivers to your door;Zomato’s big rival", "Placement Season|Campus stress peaks;Suits and nervous smiles;Companies visit colleges;Aptitude tests and interviews;Final years chase a job offer", "Group Project|Someone does all the work;One person goes missing;Shared slides at 3 AM;Teachers love assigning it;Teamwork you did not choose", "Doomscrolling|A thumb workout at midnight;You promised “one last minute”;An endless feed;Bad news on repeat;Scrolling when you should sleep", "Spotify Wrapped|Arrives every December;Everyone posts it;Shows your top artists;Colourful story cards;Your year in music", "Bigg Boss|A house full of strangers;Cameras everywhere;Weekend host drama;Nominations and evictions;A reality TV show", "Blinkit|Yellow and green;Groceries in minutes;Dark store delivery;Order at 11 PM, arrives by 11:12;A quick commerce app", "Bubble Tea|A drink with a fat straw;Chewy pearls;Started in Taiwan;Milk tea base;Also called boba", "Squid Game|Green tracksuits;Deadly childhood games;Red light, green light;A Korean series;Everyone watched it in 2021", "IPL Auction|Paddles raised;Crores spent in minutes;Franchises bid;Players are bought;Cricket’s big market", "Airport Layover|Waiting between flights;The charging port hunt;Overpriced food;Sleeping on your bags;A connecting flight gap", "Delulu|Slang for hopeful fantasy;Short for a longer word;Believing it will happen anyway;Manifesting mode;Short for delusional"];
const day=Math.floor((Date.now()+19800000)/864e5),[ans,cl]=Q[day%Q.length].split("|"),clues=cl.split(";"),K="cl_daily",no=day-20700;
let S={d:day,g:[],done:0,win:0};try{const v=JSON.parse(localStorage.getItem(K));if(v&&v.d===day)S=v}catch(e){}
const norm=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,"");
function lev(a,b){const d=[];for(let i=0;i<=a.length;i++)d[i]=[i];for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]==b[j-1]?0:1));return d[a.length][b.length]}
const st=()=>{try{return JSON.parse(localStorage.getItem("cl_streak"))||{n:0,l:0}}catch(e){return{n:0,l:0}}};
function bump(w){try{const s=st();s.n=w?(s.l===day-1?s.n+1:1):0;s.l=day;localStorage.setItem("cl_streak",JSON.stringify(s))}catch(e){}}
function draw(){const sh=S.done?5:Math.min(5,S.g.length+1);
 $("m").textContent="Puzzle #"+no+" · Streak "+st().n+"";
 $("c").innerHTML=clues.map((c,i)=>`<li class="${i<sh?"":"lock"}">${i<sh?esc(c):"Locked · Clue "+(i+1)}</li>`).join("");
 $("gs").innerHTML=S.g.map((x,i)=>`<div class="g"><span>${esc(x)}</span><span class="${S.win&&i===S.g.length-1?"ok":"no"}">${S.win&&i===S.g.length-1?"✓":"✗"}</span></div>`).join("");
 $("f").hidden=!!S.done;
 $("r").innerHTML=S.done?`<h2 class="big">${S.win?"Got it!":"Out of tries"}</h2><p>The answer was <b>${esc(ans)}</b>.</p><button class="btn pink" id="sh">Share result</button><p class="hint">Come back tomorrow for a new word.</p>`:"";
 if(S.done)$("sh").onclick=()=>{const t="Clueless Daily #"+no+" "+(S.win?S.g.length:"X")+"/5\n"+S.g.map((x,i)=>S.win&&i===S.g.length-1?"🟩":"🟥").join("")+"\n"+location.href;copyText(t).then(ok=>{$("sh").textContent=ok?"Copied!":"Copy failed"})}}
$("f").onsubmit=e=>{e.preventDefault();const g=$("gi").value.trim();if(!g||S.done)return;$("gi").value="";S.g.push(g);const n=norm(g),a=norm(ans);
 if(n===a||(n&&lev(n,a)<=(a.length>=9?2:a.length>=5?1:0))){S.done=1;S.win=1;bump(1)}else if(S.g.length>=5){S.done=1;bump(0)}
 try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}draw()};
draw();</script></body></html>
